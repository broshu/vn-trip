const TIPS_HTML = `
<div class="tips">
  <h3>📄 证件</h3>eVisa已办好,<b>打印纸质版</b>随身携带,入境时和护照一起出示。护照留复印件。
  <h3>💰 货币</h3>越南盾(VND),1元≈3,500-3,700盾(以当日汇率为准)。快速换算:<b>盾去掉3个零÷3.6≈人民币</b>。机场ATM取现+市区金店换汇,大额支付可刷卡。
  <h3>🎫 境内机票怎么买</h3>两段待订:<b>7/29 河内→岘港</b>、<b>8/2 岘港→胡志明</b>,都建议订<b>傍晚班(约18-20点起飞)</b>,落地当晚只休息、次日不用赶早。渠道:携程/Trip.com直接搜,或越捷官网(vietjetair.com)常有0元促销票。越捷/竹子是廉航,<b>默认只含7kg手提</b>,托运行李下单时加购(比机场买便宜一半)。回程<b>8/4 胡志明→杭州</b>(SGN→HGH,多为中转)也尽早订。
  <h3>📱 上网/打车</h3>机场买Viettel SIM/eSIM(约10-15万盾/10天)。全程用<b>Grab</b>打车(标价,免砍价),提前绑好卡。
  <h3>🛵 岘港租摩托</h3>自动挡12-15万盾/天。<b>中国驾照在越南不被承认</b>,被查到可能罚款(约100-200万盾),风险自担;务必戴头盔(法律要求)、慢骑、买旅行保险。租车验车拍视频,记录划痕。海云关偶有交警检查点。
  <h3>🌤 天气(7月底-8月初)</h3>三地都是33-36°C高温。河内/岘港:晴热+偶发阵雨;胡志明:雨季,<b>午后常有雷阵雨</b>(1-2小时即停),随身带轻便雨衣。防晒霜、墨镜、帽子必备。
  <h3>🚫 没排进去的</h3>下龙湾(河内往返车程4h+,1.5天放不下)——若想去,可把7/29改为下龙湾一日团;顺化(海云关再往北1h)——4天岘港不赶,想去可把7/31拉长为顺化一日。
  <h3>💵 参考花费</h3>境内两段机票约1,200-2,000元;住宿岘港海景约200-400元/晚;吃饭人均一顿20-50元;景点门票都是小钱(海云关免费,五行山/会安/占婆博物馆各几万盾)。
  <h3>⚠ 安全</h3>过马路:匀速走,别急停急退,摩托会绕开你。手机别在路边刷(飞车党),包背身前。胡志明范五老街注意随身物品。
</div>`;

const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');
const labelEl = document.getElementById('mapLabel');
const routeBtn = document.getElementById('routeBtn');
const TAG_LABEL = {food:'🍜 美食', nature:'🏞 风光', moto:'🛵 摩托', flight:'✈ 航班', tip:'⚠ 注意'};
const PR_LABEL = {must:'⭐ 必去', rec:'推荐', opt:'可选', move:'🚕 交通/固定'};

function extUrl(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function osmUrl(c){ return 'https://www.openstreetmap.org/?mlat=' + c[0] + '&mlon=' + c[1] + '#map=17/' + c[0] + '/' + c[1]; }

/* ---------- Leaflet 地图 ---------- */
const map = L.map('map', {zoomControl:true}).setView([16.0,107.8], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const dayLayer = L.layerGroup().addTo(map);
let markerByIdx = {};   // 当前天: item序号 -> marker
let currentDay = 1;

function pinIcon(text, selected){
  const cls = 'pin' + (selected ? ' sel' : '');
  const size = selected ? 32 : 26;
  return L.divIcon({ className:'', html:'<div class="'+cls+'"><span>'+text+'</span></div>',
    iconSize:[size,size], iconAnchor:[size/2,size], popupAnchor:[0,-size] });
}

// 把一天的所有地点画到地图上(数字标记 + 顺序连线),重合点合并编号
function drawDay(di, selectIdx){
  dayLayer.clearLayers();
  markerByIdx = {};
  const day = DAYS[di];
  if (!day.items.length) return;

  // 按坐标分组
  const groups = {};       // key -> {c, nums:[], labels:[]}
  const order = [];
  day.items.forEach((it, ii) => {
    const key = it.c[0].toFixed(4) + ',' + it.c[1].toFixed(4);
    if (!groups[key]) { groups[key] = {c:it.c, nums:[], items:[]}; order.push(key); }
    groups[key].nums.push(ii+1);
    groups[key].items.push(it);
  });

  const line = day.items.map(it => it.c);

  // 标记
  order.forEach(key => {
    const g = groups[key];
    const label = g.nums.join('·');
    const selected = selectIdx !== undefined && g.nums.includes(selectIdx+1);
    const popup = g.items.map(it => it.n).join('<br>')
      + '<br><a href="' + osmUrl(g.c) + '" target="_blank">OpenStreetMap ↗</a>'
      + ' · <a href="' + extUrl(g.items[0].q) + '" target="_blank">Google导航 ↗</a>';
    const m = L.marker(g.c, {icon: pinIcon(label, selected)}).bindPopup(popup, {autoPan:false}).addTo(dayLayer);
    g.nums.forEach(n => markerByIdx[n-1] = m);
  });

  // 选中航班项:画出发机场 + 航线(蓝色实线)
  if (selectIdx !== undefined && day.items[selectIdx].f){
    const it = day.items[selectIdx];
    L.polyline([it.f, it.c], {color:'#1e88e5', weight:3, opacity:.8}).addTo(dayLayer);
    L.marker(it.f, {icon: L.divIcon({className:'', html:'<div class="pin" style="background:#1e88e5"><span>✈</span></div>', iconSize:[26,26], iconAnchor:[13,26]})})
      .bindPopup('出发机场').addTo(dayLayer);
  }

  // 视野
  if (selectIdx === undefined){
    map.fitBounds(L.latLngBounds(line).pad(0.15));
  }
}

/* ---------- 左侧渲染 ---------- */
DAYS.forEach((day, di) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (di===1 ? ' active' : '');
  tab.textContent = day.tab;
  tab.onclick = () => showDay(di);
  tabsEl.appendChild(tab);

  const block = document.createElement('div');
  block.className = 'day-block' + (di===1 ? ' active' : '');
  block.id = 'day' + di;
  let html = '<div class="day-title">' + day.title + '</div>';
  if (day.note) html += '<div class="day-note">' + day.note + '</div>';
  block.innerHTML = html;

  if (day.tips) {
    block.innerHTML += TIPS_HTML;
  } else {
    day.items.forEach((it, ii) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.id = 'item-' + di + '-' + ii;
      let badges = (it.tags||[]).map(t => '<span class="badge ' + t + '">' + TAG_LABEL[t] + '</span>').join('');
      el.innerHTML = '<div class="prbadge ' + it.pr + '">' + (PR_LABEL[it.pr]||'') + '</div>'
        + '<div class="name"><span class="num">' + (ii+1) + '</span>' + it.n + '</div>'
        + '<div class="desc">' + it.d + '</div>'
        + (badges ? '<div class="badges">' + badges + '</div>' : '')
        + '<a class="gmap-link" href="' + extUrl(it.q) + '" target="_blank" onclick="event.stopPropagation()">Google导航 ↗</a> '
        + '<a class="gmap-link" href="' + osmUrl(it.c) + '" target="_blank" onclick="event.stopPropagation()">OSM ↗</a>';
      el.onclick = () => selectItem(di, ii);
      block.appendChild(el);
    });
  }
  listEl.appendChild(block);
});

function showDay(di){
  currentDay = di;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i===di));
  document.querySelectorAll('.day-block').forEach((b,i)=>b.classList.toggle('active', i===di));
  listEl.scrollTop = 0;
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  const day = DAYS[di];
  if (day.items.length){
    drawDay(di);
    labelEl.textContent = day.tab + ' · 共 ' + day.items.length + ' 个候选';
    routeBtn.style.display = 'none';
  } else {
    dayLayer.clearLayers();
    map.setView([16.0,107.8], 6);
    labelEl.textContent = '越南全境总览';
    routeBtn.style.display = 'none';
  }
}

function selectItem(di, ii){
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  const el = document.getElementById('item-' + di + '-' + ii);
  if (el){ el.classList.add('active'); el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  const it = DAYS[di].items[ii];
  drawDay(di, ii);                       // 保留全天标记,当前项高亮为大号绿色
  if (it.f){
    map.fitBounds(L.latLngBounds([it.f, it.c]).pad(0.2));           // 航班:显示整条航线
  } else {
    map.setView(it.c, 16, {animate:true});
  }
  const m = markerByIdx[ii];
  if (m) m.openPopup();
  labelEl.textContent = it.n;
  routeBtn.style.display = 'block';
}

routeBtn.onclick = () => showDay(currentDay);

// ---- 城市全景:显示某城全部景点 ----
const CITY = {
  hanoi:  {name:'河内', box:[20.9, 21.3, 105.6, 106.0]},
  danang: {name:'岘港(含会安)', box:[15.4, 16.45, 107.8, 108.65]},
  hcmc:   {name:'胡志明', box:[10.6, 11.05, 106.5, 107.0]},
};
function showCity(key){
  const cfg = CITY[key];
  dayLayer.clearLayers();
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  const seen = {}, pts = [];
  DAYS.forEach(day => (day.items||[]).forEach(it => {
    if (it.pr === 'move') return;                    // 跳过交通/固定
    const la = it.c[0], lo = it.c[1], b = cfg.box;
    if (la<b[0]||la>b[1]||lo<b[2]||lo>b[3]) return;
    const k = la.toFixed(4)+','+lo.toFixed(4);
    if (seen[k]) return; seen[k]=1; pts.push(it);
  }));
  pts.forEach((it,i) => {
    const popup = it.n
      + '<br><a href="'+extUrl(it.q)+'" target="_blank">Google导航 ↗</a>'
      + ' · <a href="'+osmUrl(it.c)+'" target="_blank">OSM ↗</a>';
    L.marker(it.c, {icon: pinIcon(i+1, false)}).bindPopup(popup, {autoPan:false}).addTo(dayLayer);
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts.map(p=>p.c)).pad(0.12));
  labelEl.textContent = cfg.name + ' · 全部地点 ' + pts.length + ' 个';
  routeBtn.style.display = 'none';
}
document.querySelectorAll('#cityOv span').forEach(s => s.onclick = () => showCity(s.dataset.c));

// 默认显示 Day1 全天
showDay(1);
</script>
